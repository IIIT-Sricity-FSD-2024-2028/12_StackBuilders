problem_statement: "Wellness Program Management Platform"
last_updated: "2026-10-17"

actors:
  - name: "Employee"
    definition: "An organization member who takes part in wellness programs and uses wellness services such as check-ins, consultations, live sessions, recorded videos, challenges, and rewards."
    aliases: ["Staff Member", "Organization Employee"]
  - name: "Wellness Expert"
    definition: "A qualified professional who provides wellness guidance, consultations, check-in responses, live sessions, or educational content to employees."
    aliases: ["Health Expert", "Wellness Professional"]
  - name: "Physical Wellness Expert"
    definition: "A wellness professional who guides employees in physical activity, fitness, movement, recovery, and related healthy routines."
    aliases: ["Fitness Trainer", "Wellness Trainer"]
  - name: "Nutritionist"
    definition: "A wellness professional who provides nutrition guidance and supports employees with food, hydration, and dietary goals."
    aliases: ["Diet Expert", "Nutrition Specialist"]
  - name: "Psychologist"
    definition: "A mental-health professional who provides psychological guidance and supports employees with stress, emotions, and mental well-being."
    aliases: ["Mental Wellness Professional", "Therapist"]
  - name: "HR Representative"
    definition: "A company representative who coordinates employee wellness activities, experts, challenges, and rewards."
    aliases: ["HR", "Human Resources Representative"]
  - name: "Administrator"
    definition: "A person responsible for overseeing platform-wide organizations, user access, and administrative policies."
    aliases: ["Admin", "Super User"]
  - name: "Supervisor"
    definition: "A person who oversees organizational participation and responds to support or operational questions related to the wellness program."
    aliases: ["Program Supervisor"]

terms:
  - name: "Company"
    definition: "An organization whose employees and wellness activities are associated with a shared wellness program."
    aliases: ["Organization", "Employer"]
  - name: "Wellness Program"
    definition: "A coordinated set of activities and services intended to support employees' physical, mental, and nutritional well-being."
    aliases: ["Health Program", "Wellness Initiative"]
  - name: "Wellness Challenge"
    definition: "A time-bound activity that encourages employees to work toward a stated wellness goal."
    aliases: ["Challenge"]
  - name: "Challenge Goal"
    definition: "A measurable or clearly described outcome that participants are encouraged to achieve during a wellness challenge."
    aliases: ["Wellness Goal"]
  - name: "Reward"
    definition: "An incentive offered to recognize or encourage participation in wellness activities or challenges."
    aliases: ["Wellness Reward", "Incentive"]
  - name: "Reward Points"
    definition: "Points associated with an employee's participation that may be used to claim eligible rewards."
    aliases: ["Points Balance"]
  - name: "Subscription Plan"
    definition: "A service arrangement that describes the wellness services and organization capacity available to a company."
    aliases: ["Company Plan"]
  - name: "Payment"
    definition: "The transfer of funds associated with a company's subscription to wellness services."
    aliases: ["Subscription Payment"]
  - name: "Consultation"
    definition: "A one-to-one interaction between an employee and a Wellness Expert for personalized wellness guidance."
    aliases: ["Wellness Consultation", "Health Consultation"]
  - name: "Consultation Request"
    definition: "An employee's request to meet with a Wellness Expert for guidance on a wellness concern or goal."
    aliases: ["Appointment Request"]
  - name: "Consultation Availability"
    definition: "A period of time that a Wellness Expert offers for employee consultations."
    aliases: ["Availability Slot"]
  - name: "Scheduled Consultation"
    definition: "An accepted consultation with an agreed date, time, duration, and meeting arrangement."
    aliases: ["Consultation Appointment"]
  - name: "Follow-up Consultation"
    definition: "A further consultation arranged to continue support after an earlier consultation or wellness check-in."
    aliases: ["Follow-up Appointment"]
  - name: "Wellness Check-in"
    definition: "A structured self-assessment through which an employee records information about their well-being and progress."
    aliases: ["Employee Check-in", "Wellness Assessment"]
  - name: "Mental Wellness Check-in"
    definition: "A self-assessment about topics such as mood, stress, sleep, focus, anxiety triggers, or requested support."
    aliases: ["Mental Health Check-in"]
  - name: "Physical Wellness Check-in"
    definition: "A self-assessment about physical activity, movement, pain, recovery, mobility, or exercise goals."
    aliases: ["Fitness Check-in"]
  - name: "Nutrition Check-in"
    definition: "A self-assessment about meals, hydration, energy, nutrition goals, or dietary challenges."
    aliases: ["Diet Check-in"]
  - name: "Check-in Response"
    definition: "Guidance or suggestions provided by a Wellness Expert in response to an employee's wellness check-in."
    aliases: ["Expert Response", "Wellness Guidance"]
  - name: "Live Session"
    definition: "A scheduled real-time wellness activity led by a Wellness Expert for participating employees."
    aliases: ["Live Wellness Session"]
  - name: "Recorded Wellness Video"
    definition: "A recorded educational or instructional video that supports an employee's wellness learning or practice."
    aliases: ["Wellness Video", "Recorded Content"]
  - name: "Video Library"
    definition: "A collection of recorded wellness videos organized so employees can browse and view relevant content."
    aliases: ["Wellness Content Library", "Content Library"]
  - name: "Rating"
    definition: "An employee's evaluation of a wellness service, session, consultation, or piece of content."
    aliases: ["User Rating", "Session Evaluation"]
  - name: "Support Query"
    definition: "A question or request for help raised by a participant or company representative about the wellness program."
    aliases: ["User Query", "Program Support Request"]
  - name: "Well-being"
    definition: "A person's overall physical, mental, and social wellness as supported by healthy routines and appropriate guidance."
    aliases: ["Wellness"]
